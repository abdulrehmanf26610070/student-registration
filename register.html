<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Registration Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-wrapper">
        <h1 class="heading">Student Registration Website</h1>
        <div class="card form-card">
            <form action="thanks.html" method="GET">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" value="Abdul Rehman" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="abdulrehman@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" value="1234567" required>
                </div>

                <div class="form-group radio-container">
                    <label>Gender:</label>
                    <div class="radio-options">
                        <input type="radio" id="male" name="gender" value="Male" checked>
                        <label for="male" class="inline-label">Male</label>
                        
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female" class="inline-label">Female</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="department">Department:</label>
                    <select id="department" name="department">
                        <option value="IT" selected>IT</option>
                        <option value="CS">CS</option>
                        <option value="EE">Electrical Engineering</option>
                        <option value="SE">Software Engineering</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
